name: Build and release NotchIsland

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notch-island-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package macOS arm64
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version and toolchain
        id: version
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid application version: %s\n' "$version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag %s must match application version v%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          swift --version

      - run: swift test

      - run: sh build-dmg.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notch-island-macos-arm64
          path: |
            dist/NotchIsland-*-arm64.dmg
            dist/NotchIsland-*-arm64.dmg.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish preview release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notch-island-macos-arm64
          path: dist

      - name: Publish the verified DMG and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          asset="NotchIsland-$APP_VERSION-arm64.dmg"
          checksum="$asset.sha256"
          (cd dist && sha256sum -c "$checksum")

          if existing=$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets,url 2>/dev/null); then
            jq -er --arg asset "$asset" --arg checksum "$checksum" '
              select((.isDraft | not) and ([.assets[].name] | index($asset) != null and index($checksum) != null))
              | .url
            ' <<< "$existing"
          else
            gh release create "$GITHUB_REF_NAME" "dist/$asset" "dist/$checksum" \
              --verify-tag --prerelease --title "NotchIsland $GITHUB_REF_NAME Preview" \
              --notes-file .github/preview-notes.md
          fi
